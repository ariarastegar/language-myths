name: Propose a myth
description: Suggest a common misconception about language that the site should answer.
title: "New myth: "
labels: ["new myth"]
body:
  - type: markdown
    attributes:
      value: |
        By submitting, you agree that your text is shared under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/), credited to your GitHub username.
        A myth is the claim people actually make, in the words they use.
        Myths are published only when an academic study (a peer-reviewed article or a scholarly book) answers them, and the short answer should summarize what that research finds.
  - type: input
    id: claim
    attributes:
      label: The myth, as people say it
      placeholder: "Bilingual children get confused and fall behind."
    validations:
      required: true
  - type: input
    id: one_liner
    attributes:
      label: Short answer
      description: One or two sentences summarizing what the research finds, which someone could say in reply.
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - History & change
        - Structure
        - Words
        - Society
        - Learning
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: Longer explanation
      description: A few short paragraphs. You can add "## Caveats" and "## Examples" sections with bullet points.
    validations:
      required: true
  - type: textarea
    id: study
    attributes:
      label: Supporting study
      description: The academic study (or studies) whose findings answer the myth. Give the full citation and a DOI or publisher link for each.
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Short ID (optional)
      description: Lowercase words joined by hyphens, used in links. Leave empty to have one made from the claim.
      placeholder: "bilingual-confusion"
