<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language myths, answered</title>
<meta name="description" content="Short answers to common misconceptions about language, with the evidence behind them.">
<meta name="theme-color" content="#f5f6f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: calm monochrome app. Off-white ground, white tiles with a hairline, heavy headings, floating bottom nav. */
:root {
  --bg: #f5f6f4; --tile: #ffffff; --ink: #111416; --muted: #6b7075; --soft: #e9eae7;
  --hair: rgba(17, 20, 22, 0.07); --ink-on: #ffffff;
  --sup: #2f7d4f; --comp: #a86b00; --counter: #b3261e;
  --font: "Manrope", "Helvetica Neue", Arial, system-ui, sans-serif;
  --r: 16px; --r-lg: 20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --tile: #1b1e21; --ink: #f2f3f1; --muted: #9aa0a6; --soft: #2a2e32;
    --hair: rgba(255, 255, 255, 0.08); --ink-on: #111416;
    --sup: #6fcf97; --comp: #f2b84b; --counter: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --tile: #1b1e21; --ink: #f2f3f1; --muted: #9aa0a6; --soft: #2a2e32;
  --hair: rgba(255, 255, 255, 0.08); --ink-on: #111416;
  --sup: #6fcf97; --comp: #f2b84b; --counter: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; font-weight: 500; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 22px 18px 120px; display: flex; flex-direction: column; gap: 18px; }

.tile { background: var(--tile); border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--hair); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; margin: 0; text-decoration: none; }
.tools { display: flex; gap: 2px; padding: 4px; border-radius: 999px; }
.icon-btn { width: 34px; height: 34px; border: 0; background: transparent; border-radius: 999px; display: grid; place-items: center; color: var(--ink); text-decoration: none; }
.icon-btn:hover { background: var(--soft); }
.icon-btn svg { width: 18px; height: 18px; }

.search { display: flex; align-items: center; gap: 10px; padding: 0 18px; border-radius: 999px; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
.search input { flex: 1; border: 0; background: transparent; font: inherit; color: var(--ink); padding: 14px 0; outline: none; }
.search input::placeholder { color: var(--muted); }

.topics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.topic { border: 0; border-radius: var(--r-lg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 18px 8px 14px; font-weight: 700; font-size: 13px; text-align: center; line-height: 1.25; }
.topic svg { width: 34px; height: 34px; }
@media (min-width: 560px) { .topics { grid-template-columns: repeat(5, minmax(0, 1fr)); } .topic { padding: 26px 8px 20px; } .topic svg { width: 40px; height: 40px; } }
.topic[aria-pressed="true"] { background: var(--ink); color: var(--ink-on); box-shadow: none; }

.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 6px; }
.sec h2 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
.sec .link { border: 0; background: none; font-weight: 700; font-size: 14px; color: var(--muted); padding: 0; }
.sec .link:hover { color: var(--ink); }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.myths { display: grid; gap: 10px; }
.myth { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; text-decoration: none; }
.myth:hover { box-shadow: inset 0 0 0 1px var(--muted); }
.myth .claim { font-weight: 700; font-size: 16px; line-height: 1.4; margin: 0; }
.myth .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 13px; color: var(--muted); }
.stance { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.stance::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.stance.supports::before { background: var(--sup); }
.stance.complicates::before { background: var(--comp); }
.stance.counterexample::before { background: var(--counter); }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--ink); color: var(--ink-on); }
.empty { color: var(--muted); text-align: center; padding: 28px 16px; margin: 0; }

.back { border: 0; align-self: flex-start; padding: 8px 14px 8px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.back svg { width: 16px; height: 16px; }
.label { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0; }
.claim-xl { font-size: clamp(26px, 6vw, 32px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin: 0; text-wrap: balance; }
.answer { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.answer p.one { font-size: 18px; font-weight: 700; line-height: 1.45; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 14px; text-decoration: none; background: var(--soft); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.pill.dark { background: var(--ink); color: var(--ink-on); }
.pill:hover { filter: brightness(0.96); }
.pill.small { padding: 6px 12px; font-size: 13px; }
.pill svg { width: 15px; height: 15px; }
.prose { padding: 18px 20px; }
.prose p { margin: 0 0 12px; } .prose p:last-child { margin-bottom: 0; }
.prose h2 { font-size: 15px; font-weight: 800; margin: 20px 0 8px; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.prose strong { font-weight: 800; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ink-on); box-shadow: none; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group h3 { margin: 6px 0 0; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.group h3::before { content: ""; width: 9px; height: 9px; border-radius: 50%; }
.group.supports h3::before { background: var(--sup); }
.group.complicates h3::before { background: var(--comp); }
.group.counterexample h3::before { background: var(--counter); }
.ev { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.ev.flash { box-shadow: inset 0 0 0 2px var(--ink); }
.ev .cite { margin: 0; font-weight: 700; font-size: 15px; line-height: 1.45; }
.ev .summary p { margin: 0; }
.ev .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); text-decoration: none; }
.tag.warn { color: var(--comp); }
.tag.btn { border: 0; }
.tag.btn:hover, a.tag:hover { color: var(--ink); }

.cta { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.cta strong { font-size: 16px; font-weight: 800; }
.cta p { margin: 0; color: var(--muted); }
.steps { display: grid; gap: 10px; }
.step { padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; }
.step .n { width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; background: var(--ink); color: var(--ink-on); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.step p { margin: 0; }
.step strong { display: block; font-weight: 800; }
.notice { padding: 18px; }

.nav { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 2px; padding: 5px; border-radius: 999px; z-index: 5; }
.nav a, .nav button { border: 0; background: transparent; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 16px; border-radius: 999px; font-size: 11px; font-weight: 700; min-width: 70px; }
.nav svg { width: 20px; height: 20px; }
.nav [aria-current="page"] { background: var(--soft); }
@media (min-width: 700px) { .myths { grid-template-columns: 1fr 1fr; } .wrap { max-width: 760px; } }
@media (prefers-reduced-motion: no-preference) { .ev, .myth { transition: box-shadow .2s; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="top"><span class="brand">Language myths</span></div>
  <p class="count">Loading…</p>
</div>
<nav class="nav tile" id="nav" aria-label="Main"></nav>

<script>
const STANCES = [["supports", "Supports the answer"], ["complicates", "Complicates it"], ["counterexample", "Counterexample"]];
const NEW_DAYS = 14;
const ICON = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 2.9.8.1-.7.4-1.1.6-1.3-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  scholar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c2 2 10 2 12 0v-5"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>'
};
// Line drawings for the topic tiles.
const TOPIC_ICON = {
  "History & change": '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6h20M14 42h20"/><path d="M16 6c0 9 16 11 16 18S16 33 16 42"/><path d="M32 6c0 9-16 11-16 18s16 9 16 18"/><path d="M20 38c1.5-2.5 6.5-2.5 8 0" /></svg>',
  "Structure": '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="28" width="14" height="12" rx="2"/><rect x="26" y="28" width="14" height="12" rx="2"/><rect x="17" y="12" width="14" height="12" rx="2"/></svg>',
  "Words": '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 34 16 12l8 22M11 27h10"/><path d="M38 34V24a5 5 0 0 0-9.5-2"/><path d="M38 29c-1 3-3.5 5-6 5a3.5 3.5 0 0 1 0-7h6"/></svg>',
  "Society": '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="17" cy="17" r="6"/><circle cx="33" cy="19" r="5"/><path d="M6 38c1.5-7 6-10 11-10s9.5 3 11 10"/><path d="M29 29c1.3-.6 2.6-1 4-1 4.5 0 8 3 9 10"/></svg>',
  "Learning": '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M24 14c-4-3-10-4-16-3v25c6-1 12 0 16 3 4-3 10-4 16-3V11c-6-1-12 0-16 3z"/><path d="M24 14v25"/></svg>'
};
const DEFAULT_TOPIC_ICON = TOPIC_ICON["Words"];

let DATA = null;
const ui = { q: "", topic: "All", type: "All", current: null };
const app = document.getElementById("app");
const nav = document.getElementById("nav");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plain = html => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent.trim(); };
function clean(html) {
  const doc = new DOMParser().parseFromString(html || "", "text/html");
  doc.querySelectorAll("script, style, iframe, object, embed, form").forEach(n => n.remove());
  doc.querySelectorAll("*").forEach(n => {
    for (const a of [...n.attributes]) {
      if (a.name.startsWith("on")) n.removeAttribute(a.name);
      if ((a.name === "href" || a.name === "src") && /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name);
    }
  });
  return doc.body.innerHTML;
}
const fmtDate = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "";
const daysAgo = iso => (Date.now() - new Date(iso + "T00:00:00").getTime()) / 864e5;
const repo = () => (DATA && DATA.site.repository) || "";
const repoReady = () => repo() && !repo().startsWith("YOUR-USERNAME");
const gh = path => `https://github.com/${repo()}/${path}`;
const evidenceFor = id => DATA.evidence.filter(e => e.myth === id);
const lastUpdated = id => evidenceFor(id).map(e => e.added).sort().pop() || "";
const mythText = m => [m.claim, m.one_liner, m.topic, plain(m.body), ...evidenceFor(m.id).flatMap(e => [plain(e.citation), plain(e.summary), ...(e.languages || [])])].join(" ").toLowerCase();

/* Theme: follows the device unless the reader picks one. */
function currentTheme() {
  const set = document.documentElement.getAttribute("data-theme");
  if (set) return set;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  document.querySelector('meta[name="theme-color"]').setAttribute("content", currentTheme() === "dark" ? "#111416" : "#f5f6f4");
}
try { applyTheme(localStorage.getItem("lm-theme")); } catch (e) { applyTheme(null); }

function topBar(left) {
  return `<div class="top">${left}
    <div class="tools tile">
      <button class="icon-btn" data-theme-toggle aria-label="Switch to ${currentTheme() === "dark" ? "light" : "dark"} mode">${currentTheme() === "dark" ? ICON.sun : ICON.moon}</button>
      ${repoReady() ? `<a class="icon-btn" href="${gh("")}" target="_blank" rel="noopener" aria-label="Source on GitHub">${ICON.github}</a>` : ""}
    </div></div>`;
}

function renderNav(view) {
  nav.innerHTML = `
    <a href="#" ${view === "home" ? 'aria-current="page"' : ""}>${ICON.home}Home</a>
    <button data-nav-search>${ICON.search}Search</button>
    ${repoReady() ? `<a href="${gh("issues/new/choose")}" target="_blank" rel="noopener">${ICON.plus}Contribute</a>` : ""}
    <a href="#about" ${view === "about" ? 'aria-current="page"' : ""}>${ICON.info}About</a>`;
}

function stanceLine(id) {
  const ev = evidenceFor(id);
  return STANCES.map(([k]) => {
    const n = ev.filter(e => e.stance === k).length;
    const word = { supports: "supporting", complicates: "complicating", counterexample: n > 1 ? "counterexamples" : "counterexample" }[k];
    return n ? `<span class="stance ${k}">${n} ${word}</span>` : "";
  }).join("");
}

function mythList() {
  const q = ui.q.trim().toLowerCase();
  const list = DATA.myths.filter(m => (ui.topic === "All" || m.topic === ui.topic) && (!q || mythText(m).includes(q)));
  if (!list.length) return `<p class="empty">No myths match that search. Try a language name or a broader word.</p>`;
  return list.map(m => {
    const fresh = evidenceFor(m.id).some(e => e.contributor !== "initial set" && e.added && daysAgo(e.added) <= NEW_DAYS);
    return `<a class="myth tile" href="#${esc(m.id)}">
      <p class="claim">${esc(m.claim)}</p>
      <div class="row">${stanceLine(m.id)}${fresh ? `<span class="badge">New evidence</span>` : ""}</div>
    </a>`;
  }).join("");
}

function renderHome() {
  renderNav("home");
  const topics = [...new Set(DATA.myths.map(m => m.topic))];
  app.innerHTML = `
    ${topBar(`<a class="brand" href="#">Language myths</a>`)}
    <label class="search tile">${ICON.search}<input type="search" id="q" placeholder="Search myths, sources, languages" aria-label="Search" value="${esc(ui.q)}"></label>
    <div class="topics">${topics.map(t => `<button class="topic tile" data-topic="${esc(t)}" aria-pressed="${t === ui.topic}">${TOPIC_ICON[t] || DEFAULT_TOPIC_ICON}<span>${esc(t)}</span></button>`).join("")}</div>
    <div class="sec">
      <h2>${ui.topic === "All" ? "Myths" : esc(ui.topic)}</h2>
      ${ui.topic !== "All" || ui.q ? `<button class="link" data-clear>Show all</button>` : `<span class="count">${DATA.myths.length} myths · ${DATA.evidence.length} sources</span>`}
    </div>
    <div class="myths" id="list">${mythList()}</div>
    <div class="cta tile">
      <strong>Know a myth that's missing?</strong>
      <p>Propose it through a short form on GitHub. A maintainer reviews it before it appears here.</p>
      ${repoReady() ? `<div class="actions"><a class="pill dark" href="${gh("issues/new?template=myth.yml")}" target="_blank" rel="noopener">Propose a myth</a></div>` : ""}
    </div>`;
  document.getElementById("q").addEventListener("input", e => { ui.q = e.target.value; document.getElementById("list").innerHTML = mythList(); });
}

// Google Scholar shows "Cited by" and "Related articles" for academic sources.
const PUBLISHER_RE = /doi\.org|cambridge\.org|springer\.com|taylorfrancis\.com|wiley\.com|oup\.com|sagepub\.com|jstor\.org|degruyter|benjamins\.com|plos\.org|elsevier|sciencedirect\.com|mitpress/i;
const SCHOLAR_TYPES = ["Study", "Primary text", "Data or corpus"];
function scholarUrl(e) {
  if (e.scholar === false || !SCHOLAR_TYPES.includes(e.type)) return "";
  const cite = plain(e.citation);
  const author = (cite.match(/^([^,(]+)/) || [])[1]?.trim() || "";
  let title = e.title;
  if (!title) { const m = cite.match(/\(\d{4}[a-z]?\)\.?\s*(.+?)\.(\s|$)/); title = m ? m[1] : ""; }
  const query = title ? `"${title.replace(/["“”']/g, " ").replace(/\s+/g, " ").trim()}" ${author}` : cite;
  return "https://scholar.google.com/scholar?q=" + encodeURIComponent(query);
}

function evHTML(e) {
  const by = e.contributor && e.contributor !== "initial set"
    ? `<a class="tag" href="https://github.com/${esc(e.contributor)}" target="_blank" rel="noopener">@${esc(e.contributor)}</a>`
    : `<span class="tag">Initial set</span>`;
  return `<article class="ev tile" id="ev-${esc(e.id)}">
    <p class="cite">${clean(e.citation)}</p>
    <div class="summary">${clean(e.summary)}</div>
    ${(e.url || scholarUrl(e)) ? `<div class="actions">
      ${e.url ? `<a class="pill small" href="${esc(e.url)}" target="_blank" rel="noopener">${ICON.ext}${PUBLISHER_RE.test(e.url) ? "Publisher page" : "Open page"}</a>` : ""}
      ${scholarUrl(e) ? `<a class="pill small" href="${esc(scholarUrl(e))}" target="_blank" rel="noopener" title="See who cites this work and related studies">${ICON.scholar}Google Scholar</a>` : ""}
    </div>` : ""}
    <div class="meta">
      <span class="tag">${esc(e.type)}</span>
      ${(e.languages || []).map(l => `<span class="tag">${esc(l)}</span>`).join("")}
      ${by}
      ${e.checked ? "" : `<span class="tag warn" title="No one has yet confirmed this against the original source">Not yet checked</span>`}
      <button class="tag btn" data-copylink="${esc(e.id)}">Copy link</button>
    </div>
  </article>`;
}

function renderMyth(id, focusEv) {
  const m = DATA.myths.find(x => x.id === id);
  if (!m) { location.hash = ""; return; }
  renderNav("myth");
  ui.current = id;
  const ev = evidenceFor(id);
  const types = ["All", ...new Set(ev.map(e => e.type))];
  if (!types.includes(ui.type)) ui.type = "All";
  const shown = ev.filter(e => ui.type === "All" || e.type === ui.type);
  const addUrl = gh(`issues/new?template=evidence.yml&title=${encodeURIComponent(`[${id}] Evidence: `)}`);
  app.innerHTML = `
    ${topBar(`<a class="back tile" href="#">${ICON.back}All myths</a>`)}
    <p class="label">${esc(m.topic)}</p>
    <h1 class="claim-xl">${esc(m.claim)}</h1>
    <div class="answer tile">
      <p class="label">Short answer</p>
      <p class="one">${esc(m.one_liner)}</p>
      <div class="actions">
        <button class="pill dark" data-copyreply>Copy reply</button>
        ${repoReady() ? `<a class="pill" href="${addUrl}" target="_blank" rel="noopener">Add evidence</a>
        <a class="pill" href="${gh(`issues?q=${encodeURIComponent(`is:issue "[${id}]"`)}`)}" target="_blank" rel="noopener">Discussion</a>` : ""}
      </div>
    </div>
    <div class="prose tile">${clean(m.body)}</div>
    <div class="sec">
      <h2>Evidence</h2>
      <span class="count">${ev.length} source${ev.length === 1 ? "" : "s"}${lastUpdated(id) ? ` · updated ${fmtDate(lastUpdated(id))}` : ""}</span>
    </div>
    ${types.length > 2 ? `<div class="chips" role="group" aria-label="Type of evidence">${types.map(t => `<button class="chip tile" data-type="${esc(t)}" aria-pressed="${t === ui.type}">${esc(t === "All" ? "All types" : t)}</button>`).join("")}</div>` : ""}
    ${STANCES.map(([k, label]) => {
      const items = shown.filter(e => e.stance === k);
      return items.length ? `<section class="group ${k}"><h3>${label} · ${items.length}</h3>${items.map(evHTML).join("")}</section>` : "";
    }).join("") || `<p class="empty">No evidence of this type yet.</p>`}
    <div class="cta tile">
      <strong>Have a study, text or counterexample?</strong>
      <p>Evidence that complicates the answer is as welcome as evidence that supports it. Every submission is reviewed before it's published.</p>
      ${repoReady() ? `<div class="actions"><a class="pill dark" href="${addUrl}" target="_blank" rel="noopener">Add evidence</a></div>` : ""}
    </div>`;
  if (focusEv) {
    const el = document.getElementById("ev-" + focusEv);
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1800); }
  } else window.scrollTo(0, 0);
}

function renderAbout() {
  renderNav("about");
  const people = new Set(DATA.evidence.map(e => e.contributor).filter(c => c && c !== "initial set"));
  app.innerHTML = `
    ${topBar(`<a class="back tile" href="#">${ICON.back}Home</a>`)}
    <h1 class="claim-xl">About this project</h1>
    <div class="prose tile">
      <p>People ask the same questions about language again and again: how old a language is, whether some languages are more logical, whether Latin is dead. The answers linguists give are fairly settled. What keeps growing is the evidence behind them.</p>
      <p>Each myth here has a short answer you can use in conversation, a longer explanation, and the sources that support it, complicate it or contradict it. Anyone can add a source.</p>
    </div>
    <div class="sec"><h2>How contributions work</h2><span class="count">${DATA.evidence.length} sources${people.size ? ` · ${people.size} contributor${people.size > 1 ? "s" : ""}` : ""}</span></div>
    <div class="steps">
      <div class="step tile"><span class="n">1</span><p><strong>Submit a source</strong>Open a myth and choose Add evidence. A short form on GitHub asks for the citation, what it shows, and whether it supports or complicates the answer.</p></div>
      <div class="step tile"><span class="n">2</span><p><strong>It gets reviewed</strong>A maintainer checks the submission and can discuss it with you before accepting it.</p></div>
      <div class="step tile"><span class="n">3</span><p><strong>It appears here</strong>Accepted sources go live within minutes, credited to your GitHub name.</p></div>
    </div>
    <div class="notice tile">
      <p class="label">About the “Not yet checked” tag</p>
      <p style="margin:6px 0 0">Some sources were added from abstracts or summaries. The tag stays until someone confirms the source against the original. Checking these is one of the most useful ways to help.</p>
    </div>
    ${repoReady() ? `<div class="actions"><a class="pill dark" href="${gh("blob/main/CONTRIBUTING.md")}" target="_blank" rel="noopener">Contribution guide</a><a class="pill" href="${gh("")}" target="_blank" rel="noopener">Source on GitHub</a></div>` : ""}`;
  window.scrollTo(0, 0);
}

async function copy(text, btn) {
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (e) { btn.textContent = "Couldn't copy"; }
  setTimeout(() => { btn.textContent = old; }, 1400);
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return renderHome();
  if (h === "about") return renderAbout();
  if (h.startsWith("ev-")) {
    const e = DATA.evidence.find(x => x.id === h.slice(3));
    if (e) return renderMyth(e.myth, e.id);
  }
  ui.type = "All";
  renderMyth(h);
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.hasAttribute("data-theme-toggle")) {
    const next = currentTheme() === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("lm-theme", next); } catch (e) {}
    route();
  }
  else if (t.dataset.topic) { ui.topic = ui.topic === t.dataset.topic ? "All" : t.dataset.topic; renderHome(); }
  else if (t.hasAttribute("data-clear")) { ui.topic = "All"; ui.q = ""; renderHome(); }
  else if (t.hasAttribute("data-nav-search")) {
    if (location.hash && location.hash !== "#") { location.hash = ""; setTimeout(() => document.getElementById("q")?.focus(), 50); }
    else { const q = document.getElementById("q"); q.focus(); q.scrollIntoView({ block: "center" }); }
  }
  else if (t.dataset.type) { ui.type = t.dataset.type; const y = window.scrollY; renderMyth(ui.current); window.scrollTo(0, y); }
  else if (t.hasAttribute("data-copyreply")) {
    const m = DATA.myths.find(x => x.id === ui.current);
    const src = evidenceFor(ui.current).find(e => e.stance === "supports");
    const page = location.href.split("#")[0] + "#" + ui.current;
    copy(`${m.one_liner}${src ? `\n\nSource: ${plain(src.citation)}${src.url ? " " + src.url : ""}` : ""}\n\nMore: ${page}`, t);
  }
  else if (t.dataset.copylink) copy(location.href.split("#")[0] + "#ev-" + t.dataset.copylink, t);
});
window.addEventListener("hashchange", route);

fetch("data.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; route(); })
  .catch(() => {
    app.innerHTML = `${topBar('<span class="brand">Language myths</span>')}
      <div class="notice tile"><strong>The myth data couldn't be loaded.</strong> GitHub builds the data file when it publishes the site, so this page only works once it's live on GitHub Pages. If it is already published, wait a minute and reload.</div>`;
  });
</script>
</body>
</html>
