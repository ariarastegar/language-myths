<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language myths, answered</title>
<meta name="description" content="Short answers to common misconceptions about language, with the evidence behind them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: home is a filterable list of myths; a myth view shows the answer, then evidence grouped by stance. */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --ink: #1b1f2a; --muted: #5b6273; --line: #dde0e8;
  --accent: #2b47c9; --accent-soft: #e6eaff;
  --support: #1f7a4d; --support-soft: #e3f4ea;
  --caveat: #9a5b00; --caveat-soft: #fff3df;
  --counter: #b42335; --counter-soft: #fde8eb;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12141b; --surface: #1b1e28; --ink: #e7e9f0; --muted: #9aa1b3; --line: #2c3040;
    --accent: #8fa2ff; --accent-soft: #252c4d;
    --support: #6fd19c; --support-soft: #17302a;
    --caveat: #f0b35a; --caveat-soft: #33281a;
    --counter: #ff8a98; --counter-soft: #3a1d24;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 820px; margin: 0 auto; padding: 28px 18px 64px; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(30px, 6vw, 42px); line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
.stats { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
input[type="search"] { width: 100%; font: inherit; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 16px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--bg); }
.row .claim { font-family: var(--font-display); font-style: italic; font-size: 19px; line-height: 1.3; margin: 0; }
.row .meta { font-size: 13px; color: var(--muted); margin: 3px 0 0; }
.counts { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
.dot { font-family: var(--font-mono); font-size: 12px; padding: 2px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.dot.supports { background: var(--support-soft); color: var(--support); }
.dot.complicates { background: var(--caveat-soft); color: var(--caveat); }
.dot.counterexample { background: var(--counter-soft); color: var(--counter); }
.new { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; font-style: normal; font-family: var(--font-body); vertical-align: middle; }
.empty { color: var(--muted); padding: 28px 16px; text-align: center; margin: 0; }
.back { font-size: 14px; color: var(--muted); text-decoration: none; align-self: flex-start; }
.back:hover { color: var(--ink); }
.topic { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
.myth-claim { font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: clamp(26px, 5vw, 34px); line-height: 1.2; margin: 0; text-wrap: balance; }
.one { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; font-weight: 600; font-size: 18px; margin: 0; max-width: 62ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font-size: 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.body { max-width: 65ch; }
.body h2 { font-size: 15px; font-weight: 600; margin: 22px 0 8px; }
.body p { margin: 0 0 12px; }
.body ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 20px; }
.section-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 0; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group h3 { font-size: 14px; font-weight: 600; margin: 8px 0 0; display: flex; gap: 8px; align-items: center; }
.group.supports h3 { color: var(--support); }
.group.complicates h3 { color: var(--caveat); }
.group.counterexample h3 { color: var(--counter); }
.ev { background: var(--surface); border: 1px solid var(--line); border-left-width: 3px; border-radius: 0 10px 10px 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.supports .ev { border-left-color: var(--support); }
.complicates .ev { border-left-color: var(--caveat); }
.counterexample .ev { border-left-color: var(--counter); }
.ev.flash { box-shadow: 0 0 0 3px var(--accent-soft); }
.ev .cite { margin: 0; font-size: 15px; }
.ev .summary p { margin: 0; color: var(--ink); }
.ev .foot { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--muted); }
.ev .unchecked { font-size: 12px; color: var(--caveat); }
.ev .link { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.contribute { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.contribute p { margin: 0; color: var(--muted); max-width: 62ch; }
footer { color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 6px; }
.notice { background: var(--caveat-soft); color: var(--ink); border-radius: 12px; padding: 16px; }
@media (max-width: 520px) { .row { flex-direction: column; align-items: flex-start; } .counts { order: 2; } }
@media (prefers-reduced-motion: no-preference) { .ev { transition: box-shadow .3s; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>Language myths, answered</h1>
    <p class="sub">Short answers to common misconceptions about language, with the evidence behind them. Anyone can add evidence.</p>
  </header>
  <p class="stats">Loading…</p>
</div>

<script>
const STANCES = [
  ["supports", "Supports the answer"],
  ["complicates", "Complicates it"],
  ["counterexample", "Counterexample"]
];
const NEW_DAYS = 14;
let DATA = null;
const ui = { q: "", topic: "All", type: "All" };
const app = document.getElementById("app");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plain = html => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent.trim(); };

// Content comes from reviewed files, but strip anything active before it reaches the page.
function clean(html) {
  const doc = new DOMParser().parseFromString(html || "", "text/html");
  doc.querySelectorAll("script, style, iframe, object, embed, form").forEach(n => n.remove());
  doc.querySelectorAll("*").forEach(n => {
    for (const a of [...n.attributes]) {
      if (a.name.startsWith("on")) n.removeAttribute(a.name);
      if ((a.name === "href" || a.name === "src") && /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name);
    }
  });
  return doc.body.innerHTML;
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
const daysAgo = iso => (Date.now() - new Date(iso + "T00:00:00").getTime()) / 864e5;

const repo = () => DATA.site.repository || "";
const repoReady = () => repo() && !repo().startsWith("YOUR-USERNAME");
const gh = path => `https://github.com/${repo()}/${path}`;

function evidenceFor(id) { return DATA.evidence.filter(e => e.myth === id); }
function lastUpdated(id) { return evidenceFor(id).map(e => e.added).sort().pop() || ""; }
function mythText(m) {
  return [m.claim, m.one_liner, m.topic, plain(m.body), ...evidenceFor(m.id).flatMap(e => [plain(e.citation), plain(e.summary), ...(e.languages || [])])].join(" ").toLowerCase();
}

function countsHTML(id) {
  const ev = evidenceFor(id);
  return STANCES.map(([k, label]) => {
    const n = ev.filter(e => e.stance === k).length;
    const word = { supports: "supporting", complicates: "complicating", counterexample: n > 1 ? "counterexamples" : "counterexample" }[k];
    return n ? `<span class="dot ${k}" title="${label}">${n} ${word}</span>` : "";
  }).join("");
}

function renderHome() {
  const topics = ["All", ...new Set(DATA.myths.map(m => m.topic))];
  const q = ui.q.trim().toLowerCase();
  const list = DATA.myths.filter(m => (ui.topic === "All" || m.topic === ui.topic) && (!q || mythText(m).includes(q)));
  const people = new Set(DATA.evidence.map(e => e.contributor).filter(c => c && c !== "initial set"));
  app.innerHTML = `
    <header>
      <h1>${esc(DATA.site.title)}</h1>
      <p class="sub">Short answers to common misconceptions about language, with the evidence behind them. Anyone can add evidence.</p>
    </header>
    <p class="stats">${DATA.myths.length} myths · ${DATA.evidence.length} pieces of evidence${people.size ? ` · ${people.size} contributor${people.size > 1 ? "s" : ""}` : ""}</p>
    <input type="search" id="q" placeholder="Search myths, sources or languages" aria-label="Search" value="${esc(ui.q)}">
    <div class="chips" role="group" aria-label="Topic">${topics.map(t => `<button class="chip" data-topic="${esc(t)}" aria-pressed="${t === ui.topic}">${esc(t)}</button>`).join("")}</div>
    <div class="list" id="list">${list.length ? list.map(m => {
      const up = lastUpdated(m.id);
      const fresh = evidenceFor(m.id).some(e => e.contributor !== "initial set" && e.added && daysAgo(e.added) <= NEW_DAYS);
      return `<a class="row" href="#${esc(m.id)}">
        <div><p class="claim">${esc(m.claim)}${fresh ? `<span class="new">New evidence</span>` : ""}</p>
        <p class="meta">${esc(m.topic)}${up ? ` · updated ${fmtDate(up)}` : ""}</p></div>
        <div class="counts">${countsHTML(m.id)}</div>
      </a>`;
    }).join("") : `<p class="empty">No myths match that search. Try a language name or a broader word.</p>`}</div>
    <div class="contribute">
      <strong>Know a myth that's missing?</strong>
      <p>Propose it through a short form on GitHub. A maintainer reviews it before it appears here.</p>
      ${repoReady() ? `<div class="actions"><a class="btn" href="${gh("issues/new?template=myth.yml")}" target="_blank" rel="noopener">Propose a myth</a></div>` : ""}
    </div>
    ${footer()}`;
  const input = document.getElementById("q");
  input.addEventListener("input", e => { ui.q = e.target.value; const pos = e.target.selectionStart; renderHome(); const i = document.getElementById("q"); i.focus(); i.setSelectionRange(pos, pos); });
}

function evHTML(e) {
  const langs = (e.languages || []).join(", ");
  const by = e.contributor && e.contributor !== "initial set"
    ? `added by <a href="https://github.com/${esc(e.contributor)}" target="_blank" rel="noopener">@${esc(e.contributor)}</a>`
    : "from the initial set";
  return `<article class="ev" id="ev-${esc(e.id)}">
    <p class="cite">${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${clean(e.citation)}</a>` : clean(e.citation)}</p>
    <div class="summary">${clean(e.summary)}</div>
    <div class="foot">
      <span>${esc(e.type)}</span>${langs ? `<span>${esc(langs)}</span>` : ""}<span>${by}</span>${e.added ? `<span>${fmtDate(e.added)}</span>` : ""}
      ${e.checked ? "" : `<span class="unchecked" title="No one has yet confirmed this against the original source">Not yet checked against the original</span>`}
      <button class="link" data-copylink="${esc(e.id)}">Copy link</button>
    </div>
  </article>`;
}

function renderMyth(id, focusEv) {
  const m = DATA.myths.find(x => x.id === id);
  if (!m) { location.hash = ""; return; }
  ui.current = id;
  const ev = evidenceFor(id);
  const types = ["All", ...new Set(ev.map(e => e.type))];
  if (!types.includes(ui.type)) ui.type = "All";
  const shown = ev.filter(e => ui.type === "All" || e.type === ui.type);
  const title = `[${id}] `;
  app.innerHTML = `
    <a class="back" href="#">← All myths</a>
    <p class="topic">${esc(m.topic)}</p>
    <h1 class="myth-claim">${esc(m.claim)}</h1>
    <p class="one">${esc(m.one_liner)}</p>
    <div class="actions">
      <button class="btn primary" data-copyreply>Copy reply</button>
      ${repoReady() ? `<a class="btn" href="${gh(`issues/new?template=evidence.yml&title=${encodeURIComponent(title + "Evidence: ")}`)}" target="_blank" rel="noopener">Add evidence</a>
      <a class="btn" href="${gh(`issues?q=${encodeURIComponent(`is:issue "[${id}]"`)}`)}" target="_blank" rel="noopener">Discussion</a>` : ""}
    </div>
    <div class="body">${clean(m.body)}</div>
    <div class="section-head">
      <h2>Evidence</h2>
      <span class="stats">${ev.length} item${ev.length === 1 ? "" : "s"}${lastUpdated(id) ? ` · updated ${fmtDate(lastUpdated(id))}` : ""}</span>
    </div>
    ${types.length > 2 ? `<div class="chips" role="group" aria-label="Type of evidence">${types.map(t => `<button class="chip" data-type="${esc(t)}" aria-pressed="${t === ui.type}">${esc(t === "All" ? "All types" : t)}</button>`).join("")}</div>` : ""}
    ${STANCES.map(([k, label]) => {
      const items = shown.filter(e => e.stance === k);
      return items.length ? `<section class="group ${k}"><h3>${label} · ${items.length}</h3>${items.map(evHTML).join("")}</section>` : "";
    }).join("") || `<p class="empty">No evidence of this type yet.</p>`}
    <div class="contribute">
      <strong>Have a study, text or counterexample for this myth?</strong>
      <p>Evidence that complicates the answer is just as welcome as evidence that supports it. Every submission is reviewed before it's published.</p>
      ${repoReady() ? `<div class="actions"><a class="btn" href="${gh(`issues/new?template=evidence.yml&title=${encodeURIComponent(title + "Evidence: ")}`)}" target="_blank" rel="noopener">Add evidence</a></div>` : ""}
    </div>
    ${footer()}`;
  if (focusEv) {
    const el = document.getElementById("ev-" + focusEv);
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1800); }
  } else window.scrollTo(0, 0);
}

function footer() {
  return `<footer>
    <span>Entries marked “Not yet checked against the original” were added from summaries or abstracts and still need someone to confirm them against the source.</span>
    ${repoReady() ? `<span><a href="${gh("blob/main/CONTRIBUTING.md")}" target="_blank" rel="noopener">How to contribute</a> · <a href="${gh("")}" target="_blank" rel="noopener">Source on GitHub</a></span>` : ""}
  </footer>`;
}

async function copy(text, btn) {
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (e) { btn.textContent = "Couldn't copy"; }
  setTimeout(() => { btn.textContent = old; }, 1400);
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return renderHome();
  if (h.startsWith("ev-")) {
    const e = DATA.evidence.find(x => x.id === h.slice(3));
    if (e) return renderMyth(e.myth, e.id);
  }
  ui.type = "All";
  renderMyth(h);
}

app.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.dataset.topic) { ui.topic = t.dataset.topic; renderHome(); }
  else if (t.dataset.type) { ui.type = t.dataset.type; const y = window.scrollY; route(); window.scrollTo(0, y); }
  else if (t.hasAttribute("data-copyreply")) {
    const id = ui.current;
    const m = DATA.myths.find(x => x.id === id);
    const src = evidenceFor(id).find(e => e.stance === "supports");
    const page = location.href.split("#")[0] + "#" + id;
    copy(`${m.one_liner}${src ? `\n\nSource: ${plain(src.citation)}${src.url ? " " + src.url : ""}` : ""}\n\nMore: ${page}`, t);
  }
  else if (t.dataset.copylink) copy(location.href.split("#")[0] + "#ev-" + t.dataset.copylink, t);
});
window.addEventListener("hashchange", route);

fetch("data.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; route(); })
  .catch(() => {
    app.innerHTML = `<header><h1>Language myths, answered</h1></header>
      <div class="notice"><strong>The myth data couldn't be loaded.</strong> GitHub builds the data file when it publishes the site, so this page only works once it's live on GitHub Pages. If it is already published, wait a minute and reload.</div>`;
  });
</script>
</body>
</html>
